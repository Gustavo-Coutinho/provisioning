# 1. antes do docker compose up, executar:
#    mkdir /home/ubuntu/mqm
#    sudo chown -R 1001:0 /home/ubuntu/mqm
# 2. substituir meudominio.com.br pelo seu dominio dentro dos arquivos do nginx (ibm-mq/etc/nginx/templates/*.conf)
#     podemos substituir dentro dos ibm-mq/etc/nginx/templates/*.conf com o seguinte comando no linux: 
#     sed -i 's/meudominio.com.br/mensageria.duckdns.org/g' ibm-mq/etc/nginx/templates/*.conf
# 3. variáveis de ambiente.env:
#     olhar o arquivo .env.example
# 4. aplicar o comando `crontab etc/crontab`
version: '3.8'

services:
  ibm-mq:
    image: ibm-mqadvanced-server-dev:9.4.1.0-amd64
    hostname: mqserver
    container_name: ibm-mq-container
    ports:
      - '1414:1414'
      - '1514:1514'
      - '9157:9157'
    environment:
      - LICENSE=accept
      - MQ_QMGR_NAME=QM1
      - MQ_CONSOLE=true
      - MQ_ENABLE_METRICS=true
      # - MQ_DEV=true
      - MQ_ADMIN_USERNAME=admin
      - MQ_ADMIN_PASSWORD_SECURE=${MQ_ADMIN_PASSWORD_SECURE}

      - MQ_APP_USERNAME=app
      - MQ_APP_PASSWORD_SECURE=${MQ_APP_PASSWORD_SECURE}
    networks:
      - ingress-internal
    volumes:
      - /home/ubuntu/mqm:/mnt/mqm
      - /home/ubuntu/mqm/log:/var/mqm/log
  # proxy-reverso com Nginx
  nginx:
    image: nginx:latest
    container_name: reverse-proxy
    environment:
      - TZ=America/Sao_Paulo
      - DOMAIN=${DOMAIN}
    ports:
      - "443:443" # Expor a porta 9443 para SSL
    volumes:
      - /home/ubuntu/ibm-mq/etc/nginx/templates/nginx.conf:/etc/nginx/nginx.conf:ro
      - /home/ubuntu/ibm-mq/etc/letsencrypt:/etc/letsencrypt
    networks:
      - ingress-internal
# Rede compartilhada entre backend, frontend e proxy reverso
networks:
  ingress-internal:
    driver: bridge
